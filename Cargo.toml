[package]
name = "metanit-parser"
version = "0.1.0"
edition = "2021"
description = "with menu parsing"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[lib]
name = "metanit_parser"
path = "src/lib.rs"
