[package]
name = "metanit-parser"
version = "0.2.0-dev"
edition = "2021"
description = "HTTP client library for accessing metanit.com"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[lib]
name = "metanit_parser"
path = "src/lib.rs"
