[package]
name = "metanit-parser"
version = "1.1.0"
edition = "2021"
description = "A Rust library for parsing metanit.com tutorial pages"
license = "MIT"
repository = "https://github.com/example/metanit-parser"
keywords = ["metanit", "parser", "scraper", "tutorial"]
categories = ["web-programming", "parsing"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[profile.release]
opt-level = 2

[lib]
name = "metanit_parser"
path = "src/lib.rs"
