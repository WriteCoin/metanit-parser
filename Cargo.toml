[package]
name = "metanit-parser"
version = "0.1.0-alpha"
edition = "2021"
description = "HTML parser library for extracting metanit.com content"
license = "MIT"

[dependencies]
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "metanit_parser"
path = "src/lib.rs"
